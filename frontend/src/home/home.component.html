<header>
  <home-navbar />
</header>

<main class='default-main'>
  <section class='default-content'>
    <section class='row-1'>
      <offer 
        class='main-offer'
        [offer]="offers[0]"
      />
      <div class='inner'>
        <offer 
          [offer]="offers[1]"
        />
        <offer 
          [offer]="offers[2]"
        />
      </div>
    </section>
    <div class='row-1-divider'></div>
    <loop 
      [offers]="offers.slice(3)"
    />
  </section>
</main>
