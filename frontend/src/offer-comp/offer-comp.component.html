<a *ngIf="!!offer" href='/offer/{{ offer.id }}'>
  <div 
    class='offer'
    style="background-image: url('{{ offer.cover }}');"
  >
    <div class='info-cnt'>
      <p class='title'> 
        {{ offer.title }}
      </p>
      <span>
        {{ categories[offer.category] }}
      </span>
      <span>
        {{ locations[offer.location] }}
      </span>
      <span>
        {{ offer.daysSinceCreation + ' дни от създаването' }}
      </span>
    </div>
  </div>
</a>
